    body: |
      ## Цель и границы Проекта Альфа
      Проект Альфа направлен на внедрение локального семантического поиска и автоматического связывания технических документов для команды разработки.
      Ключевым требованием заказчика является полная автономность без отправки конфиденциальных заметок во внешние облачные API.
      В качестве базового поискового ядра принято решение переиспользовать наработки движка SecondBrain на базе SQLite и гибридного ранжирования.
      Координацию интеграции и сроков релиза со стороны команды ведёт Иван Петров.

