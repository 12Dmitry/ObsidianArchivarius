    body: |
      ## Карта заметок по философии языка и значению
      Карта охватывает эволюцию взглядов на природу языкового значения от логического атомизма к прагматике употребления.
      Центральное противопоставление проходит между ранним подходом Витгенштейна в «Логико-философском трактате» и его поздней концепцией языковых игр.
      Изучение смены парадигмы помогает отделять формально-логическую модель пропозиций от контекстуальной семантики живой речи.
      Дополнительные материалы раскрывают роль социальных практик и речевых актов в формировании смысла.