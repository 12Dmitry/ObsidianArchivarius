      ## Обзорная карта подсистем SecondBrain
      Данная карта объединяет ключевые архитектурные решения, механизмы индексации и правила связывания локального «второго мозга».
      Хранилище построено на базе SQLite в режиме WAL с совместным использованием FTS5, кэша эмбеддингов и таблицы векторов без внешнего Qdrant.
      Качество извлечения обеспечивается нарезкой по заголовкам Markdown, исключением тегов из векторизуемых чанков, русским стеммингом и ранговым слиянием RRF.
      Безопасность модификации хранилища достигается за счёт JSON Schema structured output и связывания строго в замкнутом мире кандидатов.

