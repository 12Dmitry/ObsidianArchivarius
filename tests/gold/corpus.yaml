    related:
      - 80_Decisions/gibridnyy-poisk-rrf.md
      - 40_Insights/closed-world-linking.md
    body: |
      ## Защита от ложного слияния близких тем
      Опора только на высокий абсолютный порог косинусного сходства приводит к ложным слияниям, когда две разные заметки на смежную тему имеют сходный вектор.
      Проверка дополнительного зазора margin delta между лучшим кандидатом и вторым местом помогает отсеивать неоднозначные случаи, где лидер не отрывается от соседей.
      При одновременном превышении порога сходства и достаточного отрыва от второго кандидата заметку можно уверенно отправлять на слияние или арбитраж LLM.
      Если же несколько документов идут плотной группой с минимальным зазором, безопаснее создать новую заметку и связать её с соседями.

