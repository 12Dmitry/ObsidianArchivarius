      ## Профиль контакта: Анна Соколова
      Анна Соколова является ML-инженером, курирующим оценку качества эмбеддингов и настройку ранжирования для русскоязычных баз знаний.
      Проводила сравнительное тестирование моделей bge-m3 и лёгких мультиязычных альтернатив на наборе контрольных запросов с измерением Recall@10 и MRR.
      Отстаивает разделение этапов индексации и генерации на ноутбуках с 8 ГБ видеопамяти во избежание постоянной выгрузки весов.
      Регулярно участвует в ревью тестовых выборок для Проекта Альфа и движка SecondBrain.

  - path: 80_Decisions/vybor-bge-m3.md
    id: 01J900D0000000000000000021
    title: Выбор bge-m3 как основного мультиязычного эмбеддера
    type: decision
    tags:
      - adr/decision
      - dev/embeddings
      - dev/rag
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 50_People/anna-sokolova.md
      - 40_Insights/kesh-embeddingov-v-sqlite.md
    body: |
      ## Решение об использовании bge-m3
      В качестве базовой модели векторизации принят мультиязычный эмбеддер bge-m3 размерности 1024 из-за высокого качества работы со смешанным русско-английским текстом.
      Отказ от ранних компактных англоцентричных моделей вроде nomic-embed-text вызван слабой морфологической устойчивостью на русских запросах.
      Поскольку bge-m3 занимает около 1.2 ГБ памяти, в интерактивном режиме на 8 ГБ GPU её допустимо выносить на CPU или запускать пакетным проходом reindex.
      Смена модели эмбеддингов в будущем требует полной пересборки векторного индекса из-за изменения геометрии пространства.

  - path: 80_Decisions/otkaz-ot-qdrant.md
    id: 01J900D0000000000000000022
    title: Отказ от Qdrant в пользу встроенного векторного индекса SQLite
    type: decision
    tags:
      - adr/decision
      - dev/sqlite
      - dev/storage
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 10_Projects/second-brain-engine.md
      - 40_Insights/sqlite-wal-lokalnyy-poisk.md
    body: |
      ## Архитектурный отказ от внешнего векторного сервиса
      Поддержание отдельного контейнера Qdrant создаёт лишнюю операционную нагрузку при установке локального приложения на Windows-ноутбуке.
      На масштабе личного хранилища в 5–20 тысяч заметок перебор или индексированный поиск нормализованных векторов внутри единого файла SQLite выполняется за миллисекунды.
      Хранение полнотекстового индекса FTS5, графа связей и векторов в одной базе упрощает транзакционные откаты и резервное копирование.
      Внешний сервер Qdrant может рассматриваться вновь только при росте базы свыше сотен тысяч документов.

  - path: 80_Decisions/gibridnyy-poisk-rrf.md
    id: 01J900D0000000000000000023
    title: Внедрение гибридного поиска с ранговым слиянием RRF
    type: decision
    tags:
      - adr/decision
      - dev/search
      - dev/rag
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 30_Resources/gibridnyy-poisk-bm25-i-vektory.md
      - 40_Insights/morfologiya-fts5-snowball.md
      - 40_Insights/dedup-porog-kosinus-i-zazor.md
    body: |
      ## Использование Reciprocal Rank Fusion для слияния выдачи
      Для объединения результатов лексического поиска BM25 и векторного косинусного поиска выбран алгоритм Reciprocal Rank Fusion с константой k=60.
      RRF опирается только на позиции документов в каждом списке, поэтому не страдает от несовместимости диапазонов оценок BM25 и косинуса.
      Заметки, попавшие одновременно в оба топа кандидатов, получают устойчивое преимущество и выходят в первую пятёрку для контекста LLM.
      Настройки абляции позволяют независимо включать и отключать лексический, векторный и графовый сигналы при оценке метрик.

  - path: 80_Decisions/structured-output-vmesto-tool-calling.md
    id: 01J900D0000000000000000024
    title: Выбор Structured Output вместо Tool Calling для локальных 7B моделей
    type: decision
    tags:
      - adr/decision
      - dev/llm
      - dev/csharp
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 10_Projects/second-brain-engine.md
      - 40_Insights/closed-world-linking.md
    body: |
      ## Базовый контракт взаимодействия с локальной LLM
      На квантованных моделях класса 7B–8B многошаговый агентный цикл с вызовом инструментов часто сбоит и приводит к нестабильному формату аргументов.
      Поэтому базовый конвейер построен на одиночном запросе к API с принудительной грамматикой JSON Schema через параметр format.
      Вся логика разрешения путей, генерации ULID-идентификаторов, проверки хэшей и атомарной записи на диск вынесена в детерминированный код C#.
      Такой контракт гарантирует синтаксическую валидность ответа и предсказуемое время обработки одной заметки.

