    body: |
      ## Архитектура движка SecondBrain
      SecondBrain представляет собой локальную систему управления знаниями поверх Markdown-хранилища Obsidian на платформе .NET 10.
      Языковая модель выступает исключительно в роли извлекателя фактов и планировщика связей, тогда как валидация, дедупликация и запись файлов выполняются детерминированным кодом на C#.
      Индексный слой объединяет полнотекстовый поиск SQLite FTS5 и хранение плотных векторов в одной локальной базе данных.
      Такой подход гарантирует воспроизводимость операций, низкое потребление памяти и работу на ноутбуке с 8 ГБ видеопамяти.

  - path: 30_Resources/vitgenshteyn-ranniy.md
    id: 01J900D0000000000000000003
    title: Ранний Витгенштейн и логико-философский трактат
    type: resource
    tags:
      - philosophy/language
      - philosophy/logic
      - reading/notes
    up:
