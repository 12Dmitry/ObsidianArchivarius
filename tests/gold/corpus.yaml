    body: |
      ## Логико-философский трактат и картина мира
      В ранней философии Людвиг Витгенштейн рассматривает язык как логическое отображение структуры реальности, где мир состоит из совокупности атомарных фактов, а не просто вещей.
      Каждое осмысленное предложение представляет собой логическую картину возможного положения дел, истинность которой проверяется сопоставлением с действительностью.
      Сложные высказывания с помощью логических операций сводятся к элементарным пропозициям, образующим строгий каркас научного знания.
      Границы моего языка в рамках «Трактата» задают границы моего мира, а всё невыразимое в логической форме выводится за пределы осмысленной речи.

  - path: 30_Resources/vitgenshteyn-pozdniy.md
    id: 01J900D0000000000000000004
    title: Поздний Витгенштейн и языковые игры
    type: resource
    tags:
      - philosophy/language
      - philosophy/pragmatics
      - reading/notes
    up:
      - 90_Meta/Maps/filosofiya-yazyka.md
    related:
      - 30_Resources/vitgenshteyn-ranniy.md
      - 30_Resources/yazykovye-igry-i-pragmatika.md
    body: |
      ## Философские исследования и значение как употребление
      В поздних «Философских исследованиях» Витгенштейн отказывается от идеи единой идеальной логической формы языка и переходит к множественности повседневных практик.
      Значение слова в большинстве случаев определяется не ссылкой на фиксированный объект, а способом его употребления внутри конкретной языковой игры.
      Разные практики общения подчиняются собственным правилам, которые усваиваются через социальное взаимодействие и совместное действие, а не через строгие дефиниции.
      Понятия связываются между собой семейным сходством — пересекающейся сетью общих черт без единой обязательной сущности.

  - path: 30_Resources/yazykovye-igry-i-pragmatika.md
    id: 01J900D0000000000000000005
    title: Языковые игры и прагматика контекста
    type: resource
    tags:
      - philosophy/language
      - philosophy/pragmatics
    up:
      - 90_Meta/Maps/filosofiya-yazyka.md
    related:
      - 30_Resources/vitgenshteyn-pozdniy.md
    body: |
      ## Прагматический взгляд на смысл высказываний
      Прагматика изучает, как речевой контекст, намерения говорящего и фоновые договорённости участников меняют смысл одного и того же выражения.
      Вне конкретной ситуации фраза остаётся недоопределённой, поскольку правила интерпретации задаются социальной практикой, а не только словарным определением.
      Переход от изолированного анализа предложений к анализу речевых актов напрямую развивает интуицию позднего Витгенштейна о языковых играх.
      Понимание текста невозможно без учёта роли участников и цели коммуникации в данный момент.

  - path: 30_Resources/postgres-wal-replikatsiya.md
    id: 01J900D0000000000000000006
    title: WAL в PostgreSQL и потоковая репликация кластера
    type: resource
    tags:
      - dev/database
      - dev/postgres
      - ops/replication
    up: []
    related: []
    body: |
      ## Потоковая репликация PostgreSQL через журнал транзакций
      В кластере PostgreSQL журнал предзаписи WAL фиксирует все изменения страниц данных на основном узле до их сброса в основные файлы таблиц.
      Для обеспечения отказоустойчивости поток WAL-сегментов передаётся по сети на резервные реплики с использованием слотов репликации и механизма keepalive.
      Настройка параметров max_wal_senders и wal_keep_size предотвращает преждевременное удаление сегментов до того, как отстающая реплика успеет их вычитать.
      При переключении нагрузки на standby-узел администратор контролирует задержку воспроизведения журнала и статус синхронного подтверждения транзакций.

  - path: 30_Resources/http-kesh-cdn-zagolovki.md
    id: 01J900D0000000000000000007
    title: HTTP-кэширование и заголовки CDN на периферии
    type: resource
    tags:
      - dev/web
      - ops/cdn
      - dev/performance
    up: []
    related: []
    body: |
      ## Управление сроком жизни контента через HTTP-заголовки
      Пограничные серверы CDN снижают нагрузку на origin-бэкенд за счёт кэширования статических и полустатических ответов по правилам заголовка Cache-Control.
      Директивы s-maxage и stale-while-revalidate позволяют отдавать клиенту актуальную копию с периферийного узла, асинхронно обновляя устаревший объект в фоне.
      Для условных запросов валидации используются заголовки ETag и Last-Modified, позволяющие вернуть статус 304 Not Modified без повторной передачи тела ответа.
      Ошибочная настройка Vary или случайных query-параметров резко снижает cache hit ratio и вызывает лишние промахи до сервера приложений.

  - path: 30_Resources/gibridnyy-poisk-bm25-i-vektory.md
    id: 01J900D0000000000000000008
    title: Теория гибридного поиска BM25 и плотных векторов
    type: resource
    tags:
      - dev/search
      - dev/rag
      - dev/nlp
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 80_Decisions/gibridnyy-poisk-rrf.md
      - 40_Insights/morfologiya-fts5-snowball.md
    body: |
      ## Сочетание лексического и семантического ранжирования
      Лексические алгоритмы вроде BM25 точно находят редкие идентификаторы, имена собственные, коды ошибок и строгие термины, которые плотные эмбеддинги нередко размывают.
      Векторный поиск по косинусному сходству, напротив, успешно выявляет парафразы, синонимы и тематически близкие заметки без общих ключевых слов.
      Объединение двух списков кандидатов устраняет слепые зоны каждого метода в отдельности и повышает полноту выборки на первых десяти позициях.
      Наиболее устойчивым способом агрегации разнородных шкал оценок на практике выступает ранговое слияние без необходимости сложной калибровки весов.

  - path: 40_Insights/udalenka-izolyatsiya.md
    id: 01J900D0000000000000000009
    title: Удалённая работа усиливает изоляцию и ослабляет менторство
    type: insight
    tags:
      - work/remote
      - team/mentoring
      - personal/wellbeing
    up:
      - 90_Meta/Maps/produktivnost-i-rabota.md
    related:
      - 40_Insights/udalenka-ekonomiya-vremeni.md
    body: |
      ## Риски социальной изоляции на полной удалёнке
      При постоянной работе из дома исчезают случайные разговоры у доски и быстрый неформальный обмен опытом между разработчиками.
      Младшим и новым членам команды становится сложнее получать своевременное менторство, поскольку каждое мелкое сомнение превращается в формальный созвон в календаре.
      Со временем отсутствие живого присутствия приводит к ощущению оторванности от общих целей компании и накоплению эмоциональной усталости.
      Для компенсации изоляции требуются регулярные ритуалы парного программирования и периодические очные встречи команды.

  - path: 40_Insights/udalenka-ekonomiya-vremeni.md
    id: 01J900D0000000000000000010
    title: Удалёнка экономит время на дороге и даёт глубокий фокус
    type: insight
    tags:
      - work/remote
      - productivity/focus
      - time-management
    up:
      - 90_Meta/Maps/produktivnost-i-rabota.md
    related:
      - 40_Insights/udalenka-izolyatsiya.md
      - 40_Insights/glubokaya-rabota-bloki-vremeni.md
    body: |
      ## Преимущества отказа от ежедневных поездок в офис
      Работа в домашнем формате освобождает от одного до двух часов в день, которые раньше уходили на дорогу в транспорте и сборы.
      Это сохранённое утреннее время можно направить на сложные архитектурные задачи, пока уровень когнитивной энергии максимален.
      В отличие от шумного опенспейса, дома проще выстроить контролируемую рабочую среду без внезапных прерываний у рабочего стола.
      При грамотной организации границ дня удалённый режим заметно повышает суммарный объём глубокой инженерной работы.

  - path: 40_Insights/glubokaya-rabota-bloki-vremeni.md
    id: 01J900D0000000000000000011
    title: Непрерывные блоки глубокой работы защищают концентрацию
    type: insight
    tags:
      - productivity/focus
      - time-management
    up:
      - 90_Meta/Maps/produktivnost-i-rabota.md
    related:
      - 40_Insights/udalenka-ekonomiya-vremeni.md
    body: |
      ## Девяностоминутные интервалы без уведомлений
      Частое переключение между кодом и сообщениями в мессенджере разрушает рабочую память и требует до двадцати минут на повторное погружение в контекст.
      Выделение жёстких девяностоминутных интервалов с выключенными уведомлениями и отложенной проверкой почты кратно повышает качество решений.
      Наиболее продуктивно планировать такие сессии в первой половине дня до начала командных созвонов и оперативных обсуждений.
      Один честный блок глубокой работы даёт больше прогресса по сложной задаче, чем целый день рваной многозадачности.

  - path: 40_Insights/sqlite-wal-lokalnyy-poisk.md
    id: 01J900D0000000000000000012
    title: Режим SQLite WAL для локального однопроцессного индекса
    type: insight
    tags:
      - dev/database
      - dev/sqlite
      - dev/performance
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 80_Decisions/otkaz-ot-qdrant.md
      - 40_Insights/kesh-embeddingov-v-sqlite.md
    body: |
      ## Преимущества WAL-журнала во встроенном индексе
      Включение режима Write-Ahead Logging в локальном файле SQLite позволяет читающим поисковым запросам не блокироваться на время фоновой переиндексации заметок.
      Поскольку весь поиск и запись выполняются в рамках одного настольного приложения, отпадает необходимость в сетевых протоколах и внешнем сервере БД.
      Читатели видят консистентный снимок базы данных, пока новый коммит дописывается в отдельный файл журнала рядом с основным хранилищем.
      Периодический контрольный сброс checkpoint удерживает размер вспомогательного WAL-файла в компактных границах.

  - path: 40_Insights/kesh-embeddingov-v-sqlite.md
    id: 01J900D0000000000000000013
    title: Кэш эмбеддингов в SQLite по хэшу контента
    type: insight
    tags:
      - dev/rag
      - dev/sqlite
      - dev/performance
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 40_Insights/sqlite-wal-lokalnyy-poisk.md
      - 80_Decisions/vybor-bge-m3.md
    body: |
      ## Исключение повторного расчёта векторов
      Сохранение вычисленных эмбеддингов в таблице SQLite с ключом по SHA-256 хэшу текста фрагмента делает повторную индексацию практически мгновенной.
      Если при редактировании заметки изменился только один раздел, программа пересчитывает векторы лишь для изменённых чанков, а остальные берёт из локального кэша.
      Привязка записи кэша также к имени модели и её размерности защищает от тихого смешения несовместимых векторных пространств после обновления модели.
      Такая схема критична для ноутбуков с ограниченным ресурсом GPU, где холодный пересчёт тысяч заметок занимает минуты.

  - path: 40_Insights/closed-world-linking.md
    id: 01J900D0000000000000000014
    title: Связывание в замкнутом мире кандидатов
    type: insight
    tags:
      - dev/rag
      - dev/llm
      - pkm/linking
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 80_Decisions/structured-output-vmesto-tool-calling.md
      - 10_Projects/second-brain-engine.md
    body: |
      ## Запрет на выдумывание путей за пределами выборки
      Языковой модели нельзя разрешать самостоятельно генерировать пути файлов или произвольные названия заметок для простановки wiki-ссылок в Obsidian.
      Вместо этого система сначала отбирает ограниченное окно кандидатов через гибридный поиск, а LLM выбирает связи строго из переданных идентификаторов замкнутого мира.
      Детерминированный слой на C# дополнительно отбрасывает любую ссылку, отсутствующую в белом списке кандидатов, исключая битые связи и галлюцинации.
      Это превращает LLM из ненадёжного редактора файлов в контролируемый классификатор отношений.

  - path: 40_Insights/tegi-bez-vnedreniya-v-chunk.md
    id: 01J900D0000000000000000015
    title: Исключение тегов и метаданных из текста чанков
    type: insight
    tags:
      - dev/rag
      - dev/embeddings
      - pkm/chunking
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 40_Insights/chunking-po-zagolovkam-markdown.md
      - 80_Decisions/vybor-bge-m3.md
    body: |
      ## Чистота векторного представления текста
      Подмешивание списка тегов, технических идентификаторов и YAML Frontmatter внутрь текста фрагмента перед векторизацией искажает семантическое пространство.
      Заметки с разными смыслами, но общим широким тегом вроде dev или personal начинают искусственно сближаться по косинусному сходству.
      Вектор должен кодировать только содержательный текст раздела и его заголовок, а фильтрацию по тегам и типам следует выполнять отдельно на уровне SQL-запроса.
      Разделение семантики текста и структурных метаданных заметно снижает количество ложноположительных попаданий в топ-5.

  - path: 40_Insights/chunking-po-zagolovkam-markdown.md
    id: 01J900D0000000000000000016
    title: Нарезка заметок по заголовкам Markdown с сохранением иерархии
    type: insight
    tags:
      - dev/rag
      - pkm/chunking
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 40_Insights/tegi-bez-vnedreniya-v-chunk.md
    body: |
      ## Семантическая граница фрагментов вместо фиксированного окна
      Механическая нарезка текста по фиксированному числу символов разрывает аргументацию посередине абзаца и оставляет фрагмент без смыслового якоря.
      Разбиение по заголовкам второго и третьего уровня в Markdown естественным образом выделяет цельные микротемы заметки.
      Добавление в начало чанка пути заголовков от названия заметки до текущего раздела сохраняет необходимый контекст при поиске.
      Лишь слишком длинные секции свыше заданного лимита токенов дополнительно делятся по границам абзацев с небольшим перекрытием.

  - path: 40_Insights/morfologiya-fts5-snowball.md
    id: 01J900D0000000000000000017
    title: Проблема русской морфологии в SQLite FTS5 и стемминг
    type: insight
    tags:
      - dev/search
      - dev/sqlite
      - dev/nlp
    up:
      - 90_Meta/Maps/arkhitektura-secondbrain.md
    related:
      - 30_Resources/gibridnyy-poisk-bm25-i-vektory.md
      - 80_Decisions/gibridnyy-poisk-rrf.md
    body: |
      ## Ограничения встроенных токенизаторов для русского языка
      Стандартные токенизаторы SQLite FTS5 вроде unicode61 сравнивают слова по точному совпадению основы с окончанием и не понимают русских падежей.
      В результате запрос «заметка» не находит документ, где встречается слово «заметки» или «заметкой», что резко снижает лексическую полноту поиска.
      Поскольку встроенный стеммер Porter рассчитан только на английский язык, для русского корпуса требуется предварительная нормализация текста на стороне C#.
      Прогон токенов через русский стеммер Snowball или лёгкий лемматизатор перед записью в FTS-индекс и при разборе поискового запроса решает проблему словоформ.

